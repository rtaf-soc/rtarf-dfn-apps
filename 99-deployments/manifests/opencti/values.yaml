domain: opencti.rtarf-censor.dev-hubs.com

### OpenCTI ###
opencti:
  enabled: true
  nameOverride: opencti

  opencti:
    replicaCount: 1
    existingSecret: opencti-secret

    config:
      # URL ที่ user เปิดเข้า
      app__base_url: https://opencti.rtarf-censor.dev-hubs.com

      # ---- Elasticsearch (external) ----
      elasticsearch__url: https://es-censor-es-http.elasticsearch.svc.cluster.local:9200
      elasticsearch__ssl__reject_unauthorized: false

      # ---- Redis ----
      redis__hostname: opencti-redis-master
      redis__port: 6379

      # ---- RabbitMQ ----
      rabbitmq__hostname: opencti-rabbitmq
      rabbitmq__port: 5672
      rabbitmq__username: opencti
      rabbitmq__password: opencti

      # ---- Worker tuning (minimal resource) ----
      workers__concurrency: 1
      workers__log_level: info

  # --- Disable MinIO ---
  minio:
    enabled: false

  # --- Redis (internal) ---
  redis:
    enabled: true
    architecture: standalone

  # --- RabbitMQ (internal) ---
  rabbitmq:
    enabled: true
    auth:
      username: opencti
      password: opencti
    persistence:
      enabled: false
