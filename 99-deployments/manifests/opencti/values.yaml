domain: opencti.rtarf-censor.dev-hubs.com

### OpenCTI ###
opencti:
  enabled: true
  nameOverride: opencti

  connectors:
  - name: opencti        # Required: unique name
    enabled: true        # Enable the connector
    replicas: 1          # Number of pods
    image: {}
    env:
      CONNECTOR_CONFIDENCE_LEVEL: ""
      CONNECTOR_ID: ""
      CONNECTOR_UPDATE_EXISTING_DATA: ""
      CONNECTOR_LOG_LEVEL: "" # Empty use global config
      CONFIG_SECTORS_FILE_URL: ""
      CONFIG_GEOGRAPHY_FILE_URL: ""
      CONFIG_INTERVAL: ""
      CONNECTOR_NAME: "OpenCTI"
      CONNECTOR_SCOPE: "marking-definition,identity,location"
      CONNECTOR_TYPE: EXTERNAL_IMPORT

  - name: mitre          # Required: unique name
    enabled: true        # Enable the connector
    replicas: 1          # Number of pods
    image: {}
    env:
      MITRE_ENTERPRISE_FILE_URL: ""
      MITRE_PRE_ATTACK_FILE_URL: ""
      MITRE_MOBILE_ATTACK_FILE_URL: ""
      CONNECTOR_MITRE_INTERVAL: ""
      CONNECTOR_CONFIDENCE_LEVEL: ""
      CONNECTOR_ID: ""
      CONNECTOR_UPDATE_EXISTING_DATA: ""
      CONNECTOR_LOG_LEVEL: "" # Empty use global config
      CONNECTOR_NAME: "MITRE ATT&CK"
      CONNECTOR_SCOPE: "marking-definition,identity,attack-pattern,course-of-action,intrusion-set,campaign,malware,tool,report,external-reference-as-report"
      CONNECTOR_TYPE: EXTERNAL_IMPORT

  - name: misp
    enabled: true
    replicas: 1
    image: {}
    env:
      MISP_URL: ""
      MISP_REFERENCE_URL: ""
      MISP_KEY: ""
      MISP_SSL_VERIFY: ""
      MISP_DATETIME_ATTRIBUTE: ""
      MISP_CREATE_REPORTS: ""
      MISP_CREATE_INDICATORS: ""
      MISP_CREATE_OBSERVABLES: ""
      MISP_CREATE_OBJECT_OBSERVABLES: ""
      MISP_REPORT_CLASS: ""
      MISP_IMPORT_FROM_DATE: ""
      MISP_IMPORT_TAGS: ""
      MISP_IMPORT_TAGS_NOT: ""
      MISP_IMPORT_CREATOR_ORGS: ""
      MISP_IMPORT_OWNER_ORGS: ""
      MISP_IMPORT_DISTRIBUTION_LEVELS: ""
      MISP_IMPORT_THREAT_LEVELS: ""
      MISP_IMPORT_ONLY_PUBLISHED: ""
      MISP_IMPORT_WITH_ATTACHMENTS: ""
      MISP_IMPORT_TO_IDS_NO_SCORE: ""
      MISP_INTERVAL: ""
      CONNECTOR_CONFIDENCE_LEVEL: ""
      CONNECTOR_ID: ""
      CONNECTOR_UPDATE_EXISTING_DATA: ""
      CONNECTOR_LOG_LEVEL: "" # Empty use global config
      CONNECTOR_NAME: ""
      CONNECTOR_SCOPE: "misp"
      CONNECTOR_TYPE: EXTERNAL_IMPORT

  worker:
    envFromSecrets:
      OPENCTI_TOKEN:
        name: opencti-secret
        key: app__admin__token

  replicaCount: 1
  envFromSecrets:
    APP__ADMIN__EMAIL:
      name: opencti-secret
      key: app__admin__email

    APP__ADMIN__PASSWORD:
      name: opencti-secret
      key: app__admin__password

    APP__ADMIN__TOKEN:
      name: opencti-secret
      key: app__admin__token

  env:
    APP__BASE_URL: https://opencti.rtarf-censor.dev-hubs.com
    APP__HEALTH_ACCESS_KEY: "ChangeMe"
    ELASTICSEARCH__URL: https://opensearch-cluster-master:9200
    ELASTICSEARCH__SSL__REJECT_UNAUTHORIZED: 'false'
    ELASTICSEARCH__USERNAME: 'admin'
    ELASTICSEARCH__PASSWORD: 'PJskIEk!hsokKE123'

    RABBITMQ__HOSTNAME: "opencti-main-rabbitmq"
    RABBITMQ__USERNAME: opencti
    RABBITMQ__PASSWORD: opencti
    REDIS__HOSTNAME: opencti-main-redis

    MINIO__ENDPOINT: opencti-main-minio
    MINIO__PORT: '9000'
    MINIO__ACCESS_KEY: minioadmin
    MINIO__SECRET_KEY: supersecretpassword
    MINIO__BUCKET_NAME: opencti

  readinessProbe:
    enabled: false
  livenessProbe:
    enabled: false
  startupProbe:
    enabled: false

  # --- MinIO (internal) ---
  minio:
    enabled: true
    rootUser: minioadmin
    rootPassword: supersecretpassword

    defaultBuckets: "opencti"
    persistence:
      enabled: true
      size: 20Gi
      accessMode: ReadWriteOnce

  # --- Redis (internal) ---
  redis:
    enabled: true
    architecture: standalone

  # --- RabbitMQ (internal) ---
  rabbitmq:
    enabled: true
    auth:
      username: opencti
      password: opencti
    persistence:
      enabled: false

  opensearch:
    enabled: true
    plugins:
      enabled: true
      installList: [ 'ingest-attachment' ]

    extraEnvs:
      - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
        value: "PJskIEk!hsokKE123"

    persistence:
      enabled: true
      size: 20Gi
