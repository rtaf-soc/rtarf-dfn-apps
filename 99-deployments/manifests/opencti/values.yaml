domain: opencti.rtarf-censor.dev-hubs.com

### OpenCTI ###
opencti:
  enabled: true
  nameOverride: opencti

  replicaCount: 1
  env:
    APP__ADMIN__EMAIL: admin@opencti.local
    APP__ADMIN__PASSWORD: SuperSecret123!
    APP__ADMIN__TOKEN : 6f9b2c5e-9c71-4a3c-bcc3-0123456789ac
    APP__BASE_URL: https://opencti.rtarf-censor.dev-hubs.com
    APP__HEALTH_ACCESS_KEY: "ChangeMe"
    ELASTICSEARCH__URL: https://opensearch-cluster-master:9200
    ELASTICSEARCH__SSL__REJECT_UNAUTHORIZED: 'false'
    ELASTICSEARCH__USERNAME: 'admin'
    ELASTICSEARCH__PASSWORD: 'DuelHdboww0up;23'

    RABBITMQ__HOSTNAME: "opencti-main-rabbitmq"
    RABBITMQ__USERNAME: opencti
    RABBITMQ__PASSWORD: opencti
    REDIS__HOSTNAME: opencti-main-redis

    MINIO__ENDPOINT: opencti-main-minio
    MINIO__PORT: '9000'
    MINIO__ACCESS_KEY: minioadmin
    MINIO__SECRET_KEY: supersecretpassword
    MINIO__BUCKET_NAME: opencti

  readinessProbe:
    enabled: false
  livenessProbe:
    enabled: false
  startupProbe:
    enabled: false

  # --- Disable MinIO ---
  minio:
    enabled: true
    rootUser: minioadmin
    rootPassword: supersecretpassword

    defaultBuckets: "opencti"

  # --- Redis (internal) ---
  redis:
    enabled: true
    architecture: standalone

  # --- RabbitMQ (internal) ---
  rabbitmq:
    enabled: true
    auth:
      username: opencti
      password: opencti
    persistence:
      enabled: false

  opensearch:
    enabled: true
    plugins:
      enabled: true
      installList: [ 'ingest-attachment' ]

    extraEnvs:
      - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: opencti-secret
            key: elasticsearch_password

    persistence:
      enabled: true
      size: 20Gi
