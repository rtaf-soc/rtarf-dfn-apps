
logstash-dispatcher-es:
  enabled: true
  antiAffinity: soft

  fullnameOverride: logstash-dispatcher-es
  replicas: 2
  image: asia-southeast1-docker.pkg.dev/its-artifact-commons/utils/logstash
  imageTag: v8.15.1-3
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "1.5"
      memory: "2Gi"
  service:
    #type: NodePort
    #ports:
    #- port: 5044
    #  #protocol: UDP
    #  targetPort: 5044
    #  nodePort: 30144

  extraEnvs:
    - name: LS_JAVA_OPTS
      value: "-Xmx256m -Xms256m"

    - name: DUMMY
      value: "000"

    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name

  logstashConfig:
    logstash.yml: |
      http.host: "0.0.0.0"
      pipeline.ecs_compatibility: "disabled"

  extraVolumeMounts:
    - name: scripts
      mountPath: /scripts/
      readOnly: true

  extraVolumes:
    - name: scripts
      configMap:
        name: dispatcher-cm

  logstashPipeline:
    logstash.conf: |
      input {
        kafka {
          bootstrap_servers => "kafka.kafka.svc.cluster.local:9092"
          group_id => "for-dispatcher-es"
          consumer_threads => 1
          topics => ["transformed-topic-beat"]
          codec => "json"
          type => "log"
          auto_offset_reset => "earliest"
        }
      }

      filter {
          ruby {
            path => "/scripts/dispatcher.rb"
            script_params => {}
          }
      }

      output {
        #stdout { codec => json_lines }

        kafka {
          bootstrap_servers => "kafka.kafka.svc.cluster.local:9092"
          codec => json
          topic_id => "dispatched-topic-beat"
        }
      }
